<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER-OS // ROOT</title>
<style>
:root{--c:#00ff41;--bg:#040806;--p:#09120d}
.red{--c:#ff2a2a;--bg:#0a0303;--p:#140707}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--c);font-family:monospace;min-height:100vh;padding:12px;transition:.3s;overflow-x:hidden}
canvas{position:fixed;top:0;left:0;z-index:-1;opacity:.22}
.wrap{max-width:520px;margin:0 auto;background:var(--p);border:1px solid var(--c);box-shadow:0 0 20px rgba(0,255,65,.15);border-radius:6px;padding:15px}
.top{display:flex;justify-content:space-between;border-bottom:1px solid var(--c);padding-bottom:8px;margin-bottom:12px;font-size:.8rem}
input,button{background:#020503;border:1px solid var(--c);color:var(--c);padding:10px;font-family:inherit;font-size:.95rem;border-radius:4px;outline:none}
button{cursor:pointer;font-weight:bold;text-transform:uppercase;background:rgba(0,255,65,.1)}
button:active{background:var(--c);color:#000}
.hide{display:none!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.card{border:1px solid var(--c);padding:8px;font-size:.82rem;background:rgba(0,0,0,.4)}
.card b{display:block;font-size:.9rem;color:#fff;margin-top:3px;word-break:break-word}
.term{background:#010302;border:1px solid var(--c);height:160px;overflow-y:auto;padding:8px;font-size:.82rem;line-height:1.4;margin-bottom:8px}
.cmd-row{display:flex;gap:6px}
.cmd-row input{flex:1}
.radar{width:130px;height:130px;border:1px solid var(--c);border-radius:50%;margin:10px auto;position:relative;overflow:hidden;background:radial-gradient(circle,transparent 60%,rgba(0,255,65,.15))}
.sweep{position:absolute;width:50%;height:50%;top:0;left:50%;transform-origin:0 100%;background:linear-gradient(90deg,transparent,var(--c));opacity:.5;animation:spin 2.5s linear infinite}
.dot{position:absolute;width:8px;height:8px;background:#fff;border-radius:50%;box-shadow:0 0 8px var(--c);cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btns button{flex:1;font-size:.78rem;padding:8px 4px}
</style>
</head>
<body>
<canvas id="mx"></canvas>

<div class="wrap" id="login">
  <div class="top"><span>● KERNEL v9.4</span><span>LOCKED</span></div>
  <h3 style="margin-bottom:12px">АВТОРИЗАЦИЯ УЗЛА</h3>
  <input id="nick" placeholder="Позывной..." style="width:100%;margin-bottom:8px">
  <input id="pass" type="password" placeholder="Код доступа..." style="width:100%;margin-bottom:10px">
  <button onclick="auth()" style="width:100%">ПОДКЛЮЧИТЬСЯ</button>
</div>

<div class="wrap hide" id="panel">
  <div class="top"><span id="role">USER</span><span id="bat">BAT: --%</span></div>

  <div class="radar" onclick="pingRadar()">
    <div class="sweep"></div>
    <div class="dot" style="top:30%;left:60%" onclick="catchNode(event,'NODE-RU-01')"></div>
    <div class="dot" style="top:65%;left:28%" onclick="catchNode(event,'SAT-LINK-4')"></div>
  </div>

  <div class="grid">
    <div class="card">ТВОЙ IP:<b id="ip">Поиск...</b></div>
    <div class="card">ЛОКАЦИЯ:<b id="loc">Поиск...</b></div>
    <div class="card">ПРОВАЙДЕР:<b id="isp">Поиск...</b></div>
    <div class="card">УСТРОЙСТВО:<b id="dev">-</b></div>
  </div>

  <div class="term" id="out"></div>

  <div class="cmd-row">
    <input id="cmd" placeholder="Команда (help, scan, matrix, alert)..." onkeydown="if(event.key==='Enter')run()">
    <button onclick="run()">OK</button>
  </div>

  <div class="btns">
    <button onclick="exec('scan')">Скан</button>
    <button onclick="exec('matrix')">Матрица</button>
    <button onclick="exec('alert')">Тревога</button>
    <button onclick="exec('clear')">Очистить</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
